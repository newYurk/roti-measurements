<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>M1 · Touch.radiusX</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#12110f;color:#e9dfcf;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:0 auto;padding:20px}h1{margin:0 0 8px;font-size:25px}p{color:#c9bfb2;line-height:1.45}#pad{height:42vh;min-height:260px;margin:18px 0;border:2px solid #ca8844;border-radius:14px;background:#1b1814;touch-action:none;display:grid;place-items:center;color:#9f8c78;text-align:center;padding:20px}pre{overflow-x:auto;white-space:pre-wrap;word-break:break-word;background:#221d18;padding:14px;border-radius:10px;line-height:1.4}button{appearance:none;border:0;border-radius:8px;padding:11px 15px;color:#1a120b;background:#e1a35a;font:inherit;font-weight:700}.hint{font-size:14px}</style></head><body><main><h1>M1 · Touch.radiusX</h1><p>Проведи пальцем в зоне ниже: медленно и быстро подушечкой, потом краем пальца. После каждого прогона сделай скрин результата.</p><div id="pad">Коснись и веди пальцем здесь</div><button id="reset" type="button">Сбросить текущий прогон</button><pre id="out">Ожидание касания…</pre><p class="hint">Тест выводит только параметры касания. Ничего не сохраняется и никуда не отправляется.</p></main><script>const pad=document.querySelector('#pad'),out=document.querySelector('#out'),reset=document.querySelector('#reset');let samples=[];function summary(values){if(!values.length)return'—';const min=Math.min(...values),max=Math.max(...values),mean=values.reduce((a,b)=>a+b,0)/values.length;return`min ${min.toFixed(2)} · mean ${mean.toFixed(2)} · max ${max.toFixed(2)}`}function report(){const x=samples.map(s=>s.radiusX),y=samples.map(s=>s.radiusY),unique=new Set(x.map(v=>v.toFixed(2))).size,last=samples.at(-1);out.textContent=`Сэмплов: ${samples.length}\n\nradiusX: ${summary(x)}\nradiusY: ${summary(y)}\nУникальных значений radiusX: ${unique}\n\nПоследний сэмпл:\n${JSON.stringify(last,null,2)}`}function addTouch(t){samples.push({radiusX:t.radiusX,radiusY:t.radiusY,rotationAngle:t.rotationAngle,force:t.force,timeMs:Number(performance.now().toFixed(1))});report()}pad.addEventListener('touchstart',e=>{e.preventDefault();samples=[];addTouch(e.touches[0])},{passive:false});pad.addEventListener('touchmove',e=>{e.preventDefault();addTouch(e.touches[0])},{passive:false});reset.addEventListener('click',()=>{samples=[];out.textContent='Сброшено. Коснись зоны и веди пальцем.'});</script></body></html>
